name: CI

on:
  push:
    branches: [main, stable-balance]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test workspace
        run: cargo test --workspace --locked

  cashu-app-build:
    name: Frontend and Release Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: cashu-app/package-lock.json
      - name: Install locked dependencies
        working-directory: cashu-app
        run: npm ci
      - name: Check public release files and versions
        working-directory: cashu-app
        run: npm run check:release -- --history
      - name: Test payments
        working-directory: cashu-app
        run: npm run test:payments
      - name: Audit JavaScript dependencies
        working-directory: cashu-app
        run: npm audit --audit-level=high
      - name: Build without private configuration
        working-directory: cashu-app
        run: npm run build

  rust-audit:
    name: RustSec Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Check locked dependencies
        run: cargo audit
