<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,500;1,600&family=Poppins:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>BitNotes | Sovereign Physical Ecash</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('app_theme') || 'dark';
          document.documentElement.setAttribute('data-theme', saved);
          if (saved === 'light') {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #06110c;
        width: 100%;
        height: 100%;
      }
      #native-splash {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        background-color: #06110c;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .native-splash-medallion {
        position: relative;
        width: 112px;
        height: 112px;
        min-width: 112px;
        min-height: 112px;
        max-width: 112px;
        max-height: 112px;
        border-radius: 9999px;
        overflow: hidden;
        flex-shrink: 0;
        box-sizing: border-box;
      }
      .native-splash-logo {
        width: 112px;
        height: 112px;
        min-width: 112px;
        min-height: 112px;
        max-width: 112px;
        max-height: 112px;
        object-fit: cover;
        display: block;
        border-radius: 9999px;
      }
      .native-splash-shine-box {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        overflow: hidden;
        border-radius: 9999px;
        pointer-events: none;
        -webkit-mask-image: -webkit-radial-gradient(white, black);
        mask-image: radial-gradient(white, black);
        transform: translateZ(0);
      }
      .native-splash-shine-bar {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 60%;
        background: linear-gradient(110deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.15) 30%, rgba(255, 255, 255, 0.65) 50%, rgba(255, 255, 255, 0.15) 70%, rgba(255, 255, 255, 0) 100%);
        animation: nativeLogoShine 2.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes nativeLogoShine {
        0% { transform: translateX(-160%) skewX(-20deg); }
        35%, 100% { transform: translateX(250%) skewX(-20deg); }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="native-splash">
        <div class="native-splash-medallion">
          <img
            src="/logo.png"
            alt="BitNotes"
            width="112"
            height="112"
            class="native-splash-logo"
            style="width:112px;height:112px;min-width:112px;min-height:112px;max-width:112px;max-height:112px;object-fit:cover;display:block;border-radius:9999px;"
          />
          <div class="native-splash-shine-box">
            <div class="native-splash-shine-bar"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
